utton></div><section role="tabpanel" id="panel-phrases" aria-labelledby="reference-tab-phrases"><label class="search">文をさがす<span class="search-field"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="phrase-search" type="search" placeholder="欠席、持ち物、数学…"><button type="button" id="clear-phrase" aria-label="検索をクリア" title="検索をクリア" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span></label><div id="phrase-categories" class="reference-categories" role="group" aria-label="文のカテゴリー"></div><div id="phrase-list" class="reference-list"></div></section>
