<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef7df"><meta name="referrer" content="no-referrer"><title>通訳君</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="web/phone-theme.css"><link rel="stylesheet" href="web/app.css?v=20261006-responsive-1"></head>
<body class="phone-home"><div class="app-shell">
<header><a class="brand" href="./">通訳君<span>ことばで、つながる。</span></a><div class="header-tools"><span id="connection" role="status">準備しています</span><button id="admin" aria-label="管理者">◇</button><button id="help" aria-label="使い方">?</button><button id="settings" aria-label="設定">⚙</button></div></header>
<main class="phone-home-card"><nav class="phone-tabs" role="tablist" aria-label="モード"><button role="tab" id="tab-interpreter" aria-controls="panel-interpreter" aria-selected="true" data-tab="interpreter">↔ 通訳</button><button role="tab" id="tab-lesson" aria-controls="panel-lesson" aria-selected="false" tabindex="-1" data-tab="lesson">▤ 授業</button><button role="tab" id="tab-phrases" aria-controls="panel-phrases" aria-selected="false" tabindex="-1" data-tab="phrases">よく使う文</button><button role="tab" id="tab-terms" aria-controls="panel-terms" aria-selected="false" tabindex="-1" data-tab="terms">ことば辞典</button></nav>
<section role="tabpanel" id="panel-interpreter" aria-labelledby="tab-interpreter"><div class="section-heading"><div><p class="eyebrow">INTERPRETER</p><h1>ことばをつなぐ</h1></div><span class="chip">1対1</span></div><div class="entry-card"><label>あなたの名前<input id="name" maxlength="40" placeholder="表示する名前" autocomplete="nickname"></label><label>話すことば<select id="source-language"></select></label><label>表示することば<select id="view-language"></select></label><button class="primary" id="create-interpreter">通訳を始める <span>→</span></button></div></section>
<section role="tabpanel" id="panel-lesson" aria-labelledby="tab-lesson" hidden><div class="section-heading"><div><p class="eyebrow">CLASSROOM</p><h1>授業のことばを届ける</h1></div><span class="chip">数学</span></div><div class="entry-card"><label>単元<input id="unit" maxlength="160" placeholder="例：一次方程式、平方根"></label><label>表示することば<select id="lesson-language"></select></label><button id="teacher-login">先生のログイン</button><button class="primary" id="create-lesson">授業を始める <span>→</span></button></div><p class="small">生徒は先生の招待リンクから参加できます。</p></section>
<section role="tabpanel" id="panel-phrases" aria-labelledby="tab-phrases" hidden><div class="section-heading"><div><p class="eyebrow">PHRASES</p><h1>よく使う文</h1></div></div><label class="search">文を探す<input id="phrase-search" type="search" placeholder="欠席、持ち物、数学…"></label><div id="phrase-list" class="reference-list"></div></section>
<section role="tabpanel" id="panel-terms" aria-labelledby="tab-terms" hidden><div class="section-heading"><div><p class="eyebrow">DICTIONARY</p><h1>ことば辞典</h1></div><button id="add-term">＋ ことば</button></div><label class="search">ことばを探す<input id="term-search" type="search" placeholder="平方根、係数、欠席…"></label><div id="term-list" class="reference-list"></div></section>
<section id="live" hidden aria-label="字幕と通話"><div class="live-heading"><div><span class="chip" id="live-mode">通訳</span><h1 id="live-title">話しましょう</h1></div><button id="invite">招待</button></div><div id="participants" class="participants"></div><div id="captions" class="captions" tabindex="0" aria-label="字幕履歴"><div id="empty-caption" class="empty"><span class="speech-symbol">“</span><h2>話したことばが、ここに。</h2><p>日本語・あなたのことば・英語で表示します。</p></div></div><form id="text-form" class="text-form"><input id="text-input" maxlength="1200" aria-label="伝える文" placeholder="文字でも伝えられます" autocomplete="off"><button type="submit" aria-label="送信">→</button></form><div class="call-controls"><button id="microphone" aria-pressed="false">マイクを開始</button><button id="listen" aria-pressed="false">音声を再生</button><button id="export">履歴を保存</button><button id="leave" class="danger">退室する</button></div></section>
<p id="message" class="message" role="status" aria-live="polite"></p></main>
<footer>日本語 ＋ あなたのことば ＋ English <span>通訳君</span></footer></div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" aria-label="閉じる">×</button></div><div id="modal-body"></div></dialog><script type="module" src="web/app.js?v=20261006-admin-1"></script></body></html>
