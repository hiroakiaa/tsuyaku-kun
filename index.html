<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef7df"><meta name="referrer" content="no-referrer"><title>通訳君</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="web/phone-theme.css"><link rel="stylesheet" href="web/app.css?v=20261006-school-1"></head>
<body class="phone-home"><div class="app-shell">
<header><a class="brand" href="./">通訳君<span>ことばで、つながる。</span></a><div class="header-tools"><span id="connection" role="status">準備しています</span><button id="admin" aria-label="管理者"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></button></div></header>
<main class="phone-home-card"><nav class="phone-tabs bottom-nav" role="tablist" aria-label="モード"><button role="tab" id="tab-face" aria-controls="panel-face" aria-selected="false" tabindex="-1" data-tab="face" aria-label="対面"><i class="fa-solid fa-comments nav-icon" aria-hidden="true"></i><span class="nav-label">対面</span></button><button role="tab" id="tab-interpreter" aria-controls="panel-interpreter" aria-selected="true"  data-tab="interpreter" aria-label="通話"><i class="fa-solid fa-phone nav-icon" aria-hidden="true"></i><span class="nav-label">通話</span></button><button role="tab" id="tab-lesson" aria-controls="panel-lesson" aria-selected="false" tabindex="-1" data-tab="lesson" aria-label="先生"><i class="fa-solid fa-chalkboard-user nav-icon" aria-hidden="true"></i><span class="nav-label">先生</span></button><button role="tab" id="tab-student" aria-controls="panel-student" aria-selected="false" tabindex="-1" data-tab="student" aria-label="生徒"><i class="fa-solid fa-user-graduate nav-icon" aria-hidden="true"></i><span class="nav-label">生徒</span></button><button role="tab" id="tab-phrases" aria-controls="panel-phrases" aria-selected="false" tabindex="-1" data-tab="phrases" aria-label="よく使う文"><i class="fa-solid fa-comment-dots nav-icon" aria-hidden="true"></i><span class="nav-label">よく使う文</span></button><button role="tab" id="tab-terms" aria-controls="panel-terms" aria-selected="false" tabindex="-1" data-tab="terms" aria-label="辞典"><i class="fa-solid fa-book-open nav-icon" aria-hidden="true"></i><span class="nav-label">辞典</span></button></nav>
<section role="tabpanel" id="panel-face" aria-labelledby="tab-face" hidden><div class="entry-card"><label>自分のことば<select id="face-self-language"></select></label><label>相手のことば<select id="face-other-language"></select></label><button class="primary" id="create-face">対面通訳を始める <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></div></section><section role="tabpanel" id="panel-interpreter" aria-labelledby="tab-interpreter"><div class="entry-card"><label>あなたの名前<input id="name" maxlength="40" placeholder="表示する名前" autocomplete="nickname"></label><label>話すことば<select id="source-language"></select></label><label>表示することば<select id="view-language"></select></label><button class="primary" id="create-interpreter">通訳を始める <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></div></section>
<section role="tabpanel" id="panel-lesson" aria-labelledby="tab-lesson" hidden aria-label="先生"><div class="entry-card"><label>単元<input id="unit" maxlength="160" placeholder="例：一次方程式、平方根"></label><button class="primary" id="create-lesson">授業を作る <i class="fa-solid fa-plus" aria-hidden="true"></i></button></div></section>
<section role="tabpanel" id="panel-student" aria-labelledby="tab-student" hidden aria-label="生徒"><form id="join-lesson-form" class="entry-card"><label>表示することば<select id="lesson-language"></select></label><label>先生のルームID<input id="lesson-code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="4桁" aria-describedby="join-status"></label><button class="primary" id="join-lesson" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>参加する</span></button><p id="join-status" class="small" role="status">4桁を入力すると参加できます。</p></form></section><section role="tabpanel" id="panel-phrases" aria-labelledby="tab-phrases" hidden><label class="search">文を探す<input id="phrase-search" type="search" placeholder="欠席、持ち物、数学…"></label><div id="phrase-list" class="reference-list"></div></section>
<section role="tabpanel" id="panel-terms" aria-labelledby="tab-terms" hidden><button id="add-term"><i class="fa-solid fa-plus" aria-hidden="true"></i> ことば</button><label class="search">ことばを探す<input id="term-search" type="search" placeholder="平方根、係数、欠席…"></label><div id="term-list" class="reference-list"></div></section>
<section id="live" hidden aria-label="字幕と通話"><div class="live-heading"><div><span class="chip" id="live-mode">通訳</span><h1 id="live-title">話しましょう</h1></div><button id="invite">招待</button></div><div id="lesson-code-card" class="lesson-code-card" hidden><div><span>先生のルームID</span><strong id="lesson-room-code"></strong><small>作成から24時間</small></div><button id="copy-lesson-code" aria-label="ルームIDをコピー"><i class="fa-solid fa-copy" aria-hidden="true"></i></button></div><div id="face-controls" class="face-controls" hidden><div><strong id="face-speaker"></strong><span id="face-language"></span></div><button id="switch-speaker" type="button"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i> 話し手を切り替える</button></div><div id="participants" class="participants"></div><div id="captions" class="captions" tabindex="0" aria-label="字幕履歴"><div id="empty-caption" class="empty"><i class="fa-solid fa-comments speech-symbol" aria-hidden="true"></i><h2>話したことばが、ここに。</h2><p>日本語・あなたのことば・英語で表示します。</p></div></div><form id="text-form" class="text-form"><input id="text-input" maxlength="1200" aria-label="伝える文" placeholder="文字でも伝えられます" autocomplete="off"><button type="submit" aria-label="送信"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></form><div class="call-controls"><button id="microphone" aria-pressed="false">マイクを開始</button><button id="listen" aria-pressed="false">音声を再生</button><button id="export">履歴を保存</button><button id="leave" class="danger">退室する</button></div></section>
<p id="message" class="message" role="status" aria-live="polite"></p></main>
</div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" aria-label="閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div><div id="modal-body"></div></dialog><script type="module" src="web/app.js?v=20261006-school-1"></script></body></html>
