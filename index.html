<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef7df"><meta name="referrer" content="no-referrer"><title>通訳君</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="web/phone-theme.css"><link rel="stylesheet" href="web/app.css?v=20261007-entry-2"></head>
<body class="phone-home"><div class="app-shell">
<header><a class="brand" href="./">通訳君<span>ことばで、つながる。</span></a><div class="header-tools"><button id="reading-options" class="reading-options" aria-label="見やすさ：文字の大きさ" title="文字の大きさ"><i class="fa-solid fa-text-height" aria-hidden="true"></i><span>見やすさ</span></button><button id="connection-details" class="connection-details" aria-label="接続状況" title="接続状況"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span id="connection" role="status" class="visually-hidden">準備しています</span></button><button id="admin" aria-label="管理者"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></button></div></header>
<main class="phone-home-card"><nav class="phone-tabs bottom-nav" role="tablist" aria-label="モード"><button role="tab" id="tab-face" aria-controls="panel-face" aria-selected="true" data-tab="face" aria-label="対面"><i class="fa-solid fa-comments nav-icon" aria-hidden="true"></i><span class="nav-label">たいめん</span></button><button role="tab" id="tab-interpreter" aria-controls="panel-interpreter" aria-selected="false" tabindex="-1"  data-tab="interpreter" aria-label="通話"><i class="fa-solid fa-phone nav-icon" aria-hidden="true"></i><span class="nav-label">つうわ</span></button><button role="tab" id="tab-lesson" aria-controls="panel-lesson" aria-selected="false" tabindex="-1" data-tab="lesson" aria-label="授業"><i class="fa-solid fa-chalkboard-user nav-icon" aria-hidden="true"></i><span class="nav-label">じゅぎょう</span></button><button role="tab" id="tab-phrases" aria-controls="panel-phrases" aria-selected="false" tabindex="-1" data-tab="phrases" aria-label="よく使う文"><i class="fa-solid fa-comment-dots nav-icon" aria-hidden="true"></i><span class="nav-label">よく使う文</span></button><button role="tab" id="tab-terms" aria-controls="panel-terms" aria-selected="false" tabindex="-1" data-tab="terms" aria-label="辞典"><i class="fa-solid fa-book-open nav-icon" aria-hidden="true"></i><span class="nav-label">じてん</span></button></nav>
<section role="tabpanel" id="panel-face" aria-labelledby="tab-face"><div class="mode-intro"><h1>となりの人と話す</h1></div><div class="entry-card"><label>じぶんのことば<select id="face-self-language"></select></label><label>相手（あいて）のことば<select id="face-other-language"></select></label><button class="primary" id="create-face">話しはじめる <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></div></section><section role="tabpanel" id="panel-interpreter" aria-labelledby="tab-interpreter" hidden><div class="mode-intro"><h1>はなれた人と話す</h1></div><div class="entry-card"><label>じぶんが話すことば<select id="source-language"></select></label><button class="primary" id="create-interpreter">相手をよぶ <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></div></section>
<section role="tabpanel" id="panel-lesson" aria-labelledby="tab-lesson" hidden aria-label="授業"><div class="mode-intro"><h1>先生のことばを読む</h1></div><div class="lesson-role-switch" role="group" aria-label="授業での役割"><button id="lesson-role-teacher" type="button" aria-pressed="true"><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i>先生</button><button id="lesson-role-student" type="button" aria-pressed="false"><i class="fa-solid fa-user-graduate" aria-hidden="true"></i>生徒</button></div><div id="teacher-entry" class="entry-card"><label>読みたいことば<select id="teacher-view-language"></select></label><label>授業のテーマ（任意）<input id="unit" maxlength="160" placeholder="例：一次方程式、平方根"></label><button class="primary" id="create-lesson">授業をはじめる <i class="fa-solid fa-plus" aria-hidden="true"></i></button></div><div id="student-entry" hidden><form id="join-lesson-form" class="entry-card"><label>読みたいことば<select id="lesson-language"></select></label><label>先生の4けた番号<input id="lesson-code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="例：1234" aria-describedby="join-status"></label><button class="primary" id="join-lesson" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>授業に入る</span></button><p id="join-status" class="small" role="status"></p></form></div></section><section role="tabpanel" id="panel-phrases" aria-labelledby="tab-phrases" hidden><div class="mode-intro"><h1>よく使う文</h1></div><label class="shared-language">読みたいことば<select id="phrase-language"></select></label><label class="search">文をさがす<span class="search-field"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="phrase-search" type="search" placeholder="欠席、持ち物、数学…"><button type="button" id="clear-phrase" aria-label="検索をクリア" title="検索をクリア" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span></label><div id="phrase-list" class="reference-list"></div></section>
<section role="tabpanel" id="panel-terms" aria-labelledby="tab-terms" hidden><div class="mode-intro"><h1>ことばのじてん</h1></div><label class="shared-language">読みたいことば<select id="term-language"></select></label><button id="add-term"><i class="fa-solid fa-plus" aria-hidden="true"></i> ことばを追加</button><label class="search">ことばをさがす<span class="search-field"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="term-search" type="search" placeholder="平方根、係数、欠席…"><button type="button" id="clear-term" aria-label="検索をクリア" title="検索をクリア" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></span></label><div id="term-list" class="reference-list"></div></section>
<section id="live" hidden aria-label="字幕と通話"><div class="live-tools"><div class="live-reading-bar"><span id="live-mode-label"></span><button id="live-reading-options" class="reading-options" aria-label="見やすさ：文字の大きさ" title="文字の大きさ"><i class="fa-solid fa-text-height" aria-hidden="true"></i><span>見やすさ</span></button></div><p id="live-guide" class="live-guide" role="status" aria-live="polite"></p><button id="invite">相手をよぶ</button><div id="lesson-code-card" class="lesson-code-card" hidden><div><span>先生の4けた番号</span><strong id="lesson-room-code"></strong></div><button id="copy-lesson-code" aria-label="ルームIDをコピー" title="ルームIDをコピー。作成から24時間有効"><i class="fa-solid fa-copy" aria-hidden="true"></i></button></div><div id="face-controls" class="face-controls" hidden><div><strong id="face-speaker"></strong><span id="face-language"></span></div><button id="switch-speaker" type="button"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i> 話し手を切り替える</button></div><div id="participants" class="participants"></div></div><div id="captions" class="captions" tabindex="0" aria-label="字幕履歴"><div id="empty-caption" class="empty"><i class="fa-solid fa-comments speech-symbol" aria-hidden="true"></i><h2>話したことばが、ここに。</h2></div></div><div class="live-actions"><form id="text-form" class="text-form"><input id="text-input" maxlength="1200" aria-label="伝える文" placeholder="文字でも伝えられます" autocomplete="off"><button type="submit" aria-label="文を送る"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></form><div class="call-controls"><button id="microphone" aria-pressed="false">マイクをONにする</button><button id="leave" class="danger">ホームにもどる</button></div></div></section><p id="message" class="message" role="status" aria-live="polite"></p></main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" aria-label="閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div><div id="modal-body"></div></dialog><script type="module" src="web/app.js?v=20261007-entry-2"></script></body></html>
