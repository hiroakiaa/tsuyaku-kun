<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1d1d">
<title>資料QA君</title>
<link rel="stylesheet" href="web/documents.css?v=85">
<script type="module" src="web/documents.js?v=229"></script>
</head>
<body><div class="shell">

<main id="content"><p role="status">読み込んでいます…</p></main>
</div>
<template id="teacher">
<section class="panel document-panel create-panel">
<header class="create-heading">
<h1>資料QAを作る</h1>
<a class="document-entry" href="?v=229"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>保管庫に戻る</a>
</header>
<p id="upload-status" role="status"></p>
<form class="stack" id="upload">
<label>資料名<input name="title" maxlength="100" placeholder="例：新1年生の入学案内" required></label>
<label><span><i class="fa-solid fa-folder" aria-hidden="true"></i> 資料ファイル</span><input type="file" aria-describedby="upload-formats" name="pdf" accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx" required></label>
<p id="upload-formats" class="fine">PDF（5 MB・40ページまで）、画像・Excel・Wordは1つのPDFに変換します</p>
<label>保管先<select name="visibility"><option value="device">この端末の保管庫のみ</option><option value="shared">共通保管庫にも掲載（誰でも閲覧できます）</option></select></label>
<div class="create-actions"><small id="create-estimate" role="status" hidden>10～20秒ほどで完成します（目安）</small><button class="primary create-guide"><i class="fa-solid fa-plus" aria-hidden="true"></i> <span>作成する</span></button></div>
</form>

<div id="result" hidden>
<h2>案内ページができました</h2>
<a id="open-guide" class="ref">資料を開いて質問する →</a>
<label>共有URL<input id="guide-url" readonly></label>
<button id="copy" type="button">URLをコピー</button>
</div>
</section>
</template>
<template id="library"><section class="panel document-library">
<header class="library-heading">
<h1>資料QAの保管庫</h1><span id="library-language"></span>
<div class="library-tools">
<button id="library-search-toggle" type="button" aria-label="資料を検索" title="資料を検索" aria-controls="library-search-panel" aria-expanded="false"></button>
<button id="library-close" type="button" aria-label="閉じる" hidden>×</button>
</div>
</header>
<div id="library-search-panel" hidden><input id="library-search" type="search" aria-label="資料名" placeholder="資料を検索"></div>
<a class="document-entry" href="?create=1&amp;v=229"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>資料チャット作成</span></a>
<div class="library-tabs" role="group" aria-label="保管庫">
<button id="library-device" type="button" aria-pressed="true">この端末の資料</button>
<button id="library-shared" type="button" aria-pressed="false">共通の資料</button>
</div>
<div class="library-tabs library-order" role="group" aria-label="表示する資料">
<button id="library-all" type="button" aria-pressed="true">すべて</button>
<button id="library-viewed" type="button" aria-pressed="false">閲覧履歴</button>
</div>
<div id="library-device-panel"><p id="library-status" role="status"></p><ul id="library-list"></ul></div>
<div id="library-shared-panel" hidden><p id="shared-status" role="status"></p><ul id="shared-list"></ul></div>
</section>
</template>
<template id="reader">
<header class="reader-heading"><h1 id="doc-title"></h1><a class="ref" href="?v=229">保管庫に戻る</a><button class="open-material" type="button" hidden>資料追加</button></header>
<dialog id="material-dialog" aria-labelledby="material-heading">
<header class="reader-heading"><h2 id="material-heading" tabindex="-1" autofocus>資料追加</h2><form method="dialog"><button aria-label="資料追加を閉じる">×</button></form></header>
<form id="add-material"><label>追加資料<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx" required></label><button>追加する</button><p id="material-status" role="status"></p></form>
<form id="replace-pdf" hidden><label>新しいPDF<input name="pdf" type="file" accept=".pdf,application/pdf" required></label><button type="submit">元のPDFを差し替える</button><button type="button" id="reanalyse-pdf">登録済みのPDFを再解析</button><p role="status"></p></form>
<ul id="materials"></ul>
<button id="remove-guide" hidden>共有を終了</button><p id="remove-status" role="status"></p>
</dialog>
<dialog id="read-translation" class="panel" aria-labelledby="read-translation-title">
<header class="reader-heading"><h2 id="read-translation-title" tabindex="-1" autofocus>訳文</h2><form method="dialog"><button aria-label="訳文を閉じる">×</button></form></header>
<p id="read-translation-text"></p>
</dialog>
<dialog id="points" class="panel" aria-labelledby="points-title">
<header class="reader-heading"><h2 id="points-title" tabindex="-1" autofocus>要約</h2><form method="dialog"><button aria-label="要約を閉じる">×</button></form></header>
<p id="summary-status" class="fine" role="status" hidden></p><div id="cards" class="cards"></div>
</dialog>
<dialog id="ask-dialog" aria-labelledby="ask-heading"><div class="qa-workspace"><div id="qa-divider" role="separator" aria-label="列幅" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div><div class="ask-layout"><div class="ask-heading"><h2 id="ask-heading" tabindex="-1" autofocus></h2><div class="qa-actions"><button id="qa-swap" type="button">左右入れ替え</button></div></div>
<div id="messages" role="log" aria-live="polite"><p class="answer-empty">回答がここに表示されます</p></div>
<form id="ask-form"><label for="question" class="sr">資料への質問</label><input id="question" maxlength="300" placeholder="質問を入力してください" required><button class="primary">送る</button><button id="ask-stop" type="button" hidden>停止</button></form>
<p id="answer-status" class="fine" role="status"></p>
</div></div></dialog>

<dialog id="pdf-dialog" aria-labelledby="pdf-heading">
<header class="pdf-bar">
<h2 id="pdf-heading" tabindex="-1" autofocus></h2>
<select id="pdf-language" hidden></select>
<button id="pdf-summary" type="button" aria-haspopup="dialog" aria-controls="points">要約</button>
<button id="pdf-toc-toggle" type="button" aria-controls="pdf-toc" aria-expanded="false" aria-label="目次" title="目次" hidden></button>
<button id="pdf-find-toggle" type="button" aria-controls="pdf-find" aria-expanded="false" aria-label="検索" title="検索" hidden></button>
<a id="pdf-file" class="ref" hidden>ダウンロード</a>
<form method="dialog"><button aria-label="資料を閉じる">×</button></form>
</header>
<div class="pdf-stage">
<div class="pdf-stage-tools"><div id="pdf-language-toggle" class="pdf-language-toggle" role="group" aria-label="資料の表示言語" hidden></div></div>
<div id="pdf-scroll"><div id="pdf-pages"></div><img id="source-image" hidden alt=""></div>
<div id="pdf-translation" dir="auto" aria-live="polite" hidden></div>
<section id="pdf-find" aria-label="PDF内検索" hidden>
  <form><label class="sr" for="pdf-find-query">PDF内の語句</label><input id="pdf-find-query" type="search" placeholder="PDF内の語句" maxlength="100" required><button>検索</button></form>
  <p role="status"></p><div class="pdf-find-navigation" hidden><button type="button" aria-label="前の一致ページ">←</button><output></output><button type="button" aria-label="次の一致ページ">→</button></div><ul></ul>
</section>
<nav id="pdf-toc" aria-label="PDFの目次" hidden></nav>
<p id="pdf-translation-progress" role="status" hidden>翻訳しています…</p>
<p id="pdf-status" role="status"></p>
<div class="pdf-zoom"><button id="qa-expand" type="button" aria-label="PDF全画面" hidden></button><button id="zoom-in" aria-label="拡大">＋</button><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-fit" type="button" aria-label="ページ幅に戻す" title="ページ幅に戻す" hidden>幅</button></div>
</div>
<p id="pdf-english-progress" role="status" hidden></p>
<nav class="pdf-navigation" aria-label="ページ送り"><button class="open-material pdf-add" type="button" aria-label="資料追加" hidden>資料追加</button><span id="pdf-language-picker"></span><button id="pdf-answer-return" type="button" hidden>回答へ</button><button id="pdf-prev" aria-label="前のページ">←</button><select id="pdf-page" aria-label="ページ番号"></select><button id="pdf-next" aria-label="次のページ">→</button><div id="pdf-citation-navigation" role="group" aria-label="根拠を移動" hidden><button id="pdf-citation-previous" type="button" aria-label="前の根拠">‹</button><output aria-label="根拠番号"></output><button id="pdf-citation-next" type="button" aria-label="次の根拠">›</button></div></nav>
</dialog>
</template>
</body>
</html>
