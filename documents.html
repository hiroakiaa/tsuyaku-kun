<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1d1d">
<title>資料QA君</title>
<link rel="stylesheet" href="web/documents.css?v=39">
<script type="module" src="web/documents.js?v=39"></script>
</head>
<body><div class="shell">

<main id="content"><p role="status">読み込んでいます…</p></main>
</div>
<template id="teacher">
<section class="intro">
<h1>資料QAを作る</h1>
<a class="register-link" href="?v=39">保管庫を開く</a>
<p>資料を登録すると、要点を示し、資料専用のチャットボットを作ります。</p>
</section>
<section class="panel document-panel">
<form class="stack" id="upload">
<label>案内のタイトル<input name="title" maxlength="100" placeholder="例：新1年生の入学案内" required></label>
<label>資料データ<input type="file" name="pdf" accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx" required></label>
<p class="fine">PDF、5 MB、40ページまで。画像（PNG・JPEG・WebP）、Excel（.xlsx）、Word（.docx）にも対応。</p>
<label>保管先<select name="visibility"><option value="device">この端末の保管庫のみ</option><option value="shared">共通保管庫にも掲載（誰でも閲覧できます）</option></select></label>
<button class="primary create-guide">作成する</button>
</form>
<p id="upload-status" role="status"></p>
<div id="result" hidden>
<h2>案内ページができました</h2>
<a id="open-guide" class="ref">案内ページを開く →</a>
<label>共有URL<input id="guide-url" readonly></label>
<button id="copy" type="button">URLをコピー</button>
<p class="fine">共有期間は作成から30日間です。</p>
</div>
</section>
</template>
<template id="library"><section class="panel document-library">
<header class="library-heading"><h1>資料QAの保管庫</h1><a class="document-entry" href="?create=1&amp;v=39">資料チャット作成</a></header>
<div class="library-filters"><label>資料名<input id="library-search" type="search"></label><label>並べ替え<select id="library-sort"><option value="recent">最近開いた順</option><option value="new">登録日の新しい順</option><option value="title">資料名順</option><option value="expiry">期限が近い順</option></select></label></div>
<h2>このブラウザーの保管庫</h2>
<p class="fine">このブラウザーに共有URLを保存します。資料は作成から30日間開けます。</p>

<p id="library-status" role="status"></p>
<ul id="library-list"></ul>
<h2>共通保管庫</h2><p id="shared-status" role="status"></p><ul id="shared-list"></ul>
</section>
</template>
<template id="reader">
<header class="reader-heading"><h1 id="doc-title"></h1><button class="open-material" type="button" hidden>資料追加</button></header>
<dialog id="material-dialog" aria-labelledby="material-heading">
<header class="reader-heading"><h2 id="material-heading" tabindex="-1" autofocus>資料追加</h2><form method="dialog"><button aria-label="資料追加を閉じる">×</button></form></header>
<form id="add-material"><label>追加資料<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx" required></label><button>追加する</button><p id="material-status" role="status"></p></form>
<ul id="materials"></ul>
<button id="remove-guide" hidden>共有を終了</button><p id="remove-status" role="status"></p>
</dialog>
<div class="doc-tabs" role="tablist" aria-label="資料の案内"><button id="tab-points" role="tab" aria-controls="points" aria-selected="true">要点</button><button id="tab-ask" role="tab" aria-controls="ask" aria-selected="false" tabindex="-1">質問する</button></div>
<section class="panel" id="points" role="tabpanel" aria-labelledby="tab-points"><h2 id="points-title">まず確認すること</h2><div id="cards" class="cards"></div></section>
<section class="panel" id="ask" role="tabpanel" aria-labelledby="tab-ask" hidden>
<dialog id="ask-dialog" aria-labelledby="ask-heading"><div class="qa-workspace"><div id="qa-divider" role="separator" aria-label="列幅" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div><div class="ask-layout"><div class="ask-heading"><h2 id="ask-heading" tabindex="-1" autofocus></h2><div class="qa-actions"><button id="qa-source" type="button">元のPDF</button><button id="qa-swap" type="button">左右入れ替え</button><button class="open-material" type="button" hidden>資料追加</button><form method="dialog"><button aria-label="質問画面を閉じる">×</button></form></div></div>
<div id="messages" role="log" aria-live="polite"></div>
<form id="ask-form"><label for="question" class="sr">資料への質問</label><input id="question" maxlength="300" placeholder="例：いつまでに だしますか？" required><button class="primary">送る</button></form>
<p id="answer-status" class="fine" role="status"></p>
</div></div></dialog>
</section>

<dialog id="pdf-dialog" aria-labelledby="pdf-heading">
<header class="pdf-bar">
<h2 id="pdf-heading" tabindex="-1" autofocus></h2>
<button id="pdf-toc-toggle" type="button" aria-controls="pdf-toc" aria-expanded="false" hidden>目次</button>
<a id="pdf-file" target="_blank" rel="noopener" class="ref">別タブで開く ↗</a>
<form method="dialog"><button aria-label="資料を閉じる">×</button></form>
</header>
<div class="pdf-stage">
<div id="pdf-scroll"><div id="pdf-pages"></div><img id="source-image" hidden alt=""></div>
<nav id="pdf-toc" aria-label="PDFの目次" hidden></nav>
<p id="pdf-status" role="status"></p>
<div class="pdf-zoom"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-in" aria-label="拡大">＋</button></div>
</div>
<nav class="pdf-navigation" aria-label="ページ送り"><button id="pdf-prev" aria-label="前のページ">←</button><select id="pdf-page" aria-label="ページ番号"></select><button id="pdf-next" aria-label="次のページ">→</button></nav>
</dialog>
</template>
</body>
</html>
