name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_only:
        description: Verify the published app without deploying
        type: boolean
        default: false
  schedule:
    - cron: '23 20 * * 0'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'schedule' && !inputs.verification_only }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Regrade saved document QA measurements
        run: |
          node tools/evaluate-document-qa.mjs docs/document-qa-current-benchmark.json --baseline-five --require-pass
          node tools/evaluate-document-qa.mjs docs/document-qa-same-fees-timing.json --two-fees --require-pass --require-retrieval
      - if: github.event_name != 'schedule' && !inputs.verification_only
        run: |
          mkdir -p site/web site/server
          cp index.html documents.html site/
          cp -R web/. site/web/
          cp server/catalog.js site/server/
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("site/web/release-checks.json", JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,preparedAt:new Date().toISOString(),checks:["npm test"]}));'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' && !inputs.verification_only
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' && !inputs.verification_only
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Wait for artifact availability
        if: github.event_name != 'schedule' && !inputs.verification_only
        run: sleep 30
      - name: Deploy
        if: github.event_name != 'schedule' && !inputs.verification_only
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published release
        run: |
          for attempt in 1 2 3 4 5; do
            node tools/verify-release.mjs && exit 0
            sleep 10
          done
          exit 1
      - name: Install browser for document QA
        id: document_browser
        run: |
          npm install --no-save --package-lock=false playwright@1.61.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify document QA in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-pdf-report.json
        run: node tools/smoke-document-qa.mjs
      - name: Verify an existing document in the published app
        if: ${{ vars.DOCUMENT_QA_EXISTING_FIXTURE != '' }}
        env:
          DOCUMENT_QA_EXISTING_FIXTURE: ${{ vars.DOCUMENT_QA_EXISTING_FIXTURE }}
        run: node tools/smoke-document-qa-existing.mjs
      - name: Verify long PDF citations in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-long-pdf-report.json
        run: node tools/smoke-document-qa.mjs --long --compare-search
      - name: Verify dense PDF citations in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-dense-pdf-report.json
        run: node tools/smoke-document-qa.mjs --dense
      - name: Verify worksheet answers and citations in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-tables-report.json
        run: node tools/smoke-document-qa-tables.mjs
      - name: Verify merged worksheet values in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-merged-report.json
        run: node tools/smoke-document-qa-tables.mjs --merged
      - name: Verify the same opening questions in reverse order
        env:
          DOCUMENT_QA_REPORT: document-qa-merged-reversed-report.json
        run: node tools/smoke-document-qa-tables.mjs --merged --reverse-opening
      - name: Verify zero-valued merged cells in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-zero-report.json
        run: node tools/smoke-document-qa-tables.mjs --zero
      - name: Verify worksheet columns beyond Z
        env:
          DOCUMENT_QA_REPORT: document-qa-wide-report.json
        run: node tools/smoke-document-qa-tables.mjs --wide
      - name: Verify inventory worksheet answers and citations
        env:
          DOCUMENT_QA_REPORT: document-qa-inventory-report.json
        run: node tools/smoke-document-qa-tables.mjs --inventory
      - name: Verify ambiguous admission years in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-admission-years-report.json
        run: node tools/smoke-document-qa-admission-years.mjs
      - name: Verify PDF upload boundaries in the published app
        run: node tools/smoke-document-qa-pdf-limits.mjs
      - name: Verify a PDF at both upload limits in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-pdf-limits-report.json
        run: node tools/smoke-document-qa.mjs --page-limit --size-limit
      - name: Verify Word pagination and citations in the published app
        env:
          DOCUMENT_QA_REPORT: document-qa-word-report.json
        run: node tools/smoke-document-qa-word.mjs
      - name: Verify image OCR and citations in the published app
        run: DOCUMENT_QA_REPORT=document-qa-image-png-en-report.json node tools/smoke-document-qa-image.mjs png en --append
      - name: Verify JPEG and WebP OCR in the published app
        run: |
          DOCUMENT_QA_REPORT=document-qa-image-jpeg-en-report.json node tools/smoke-document-qa-image.mjs jpeg
          DOCUMENT_QA_REPORT=document-qa-image-webp-en-report.json node tools/smoke-document-qa-image.mjs webp
      - name: Verify Japanese image OCR in the published app
        run: |
          DOCUMENT_QA_REPORT=document-qa-image-png-ja-report.json node tools/smoke-document-qa-image.mjs png ja
      - name: Verify initial PDF, Excel and scan acceptance questions
        if: ${{ !cancelled() && steps.document_browser.outcome == 'success' }}
        env:
          DOCUMENT_QA_REPORT: document-qa-acceptance-report.json
          DOCUMENT_QA_SAVE_SYNTHETIC_PDF: document-qa-synthetic-scan.pdf
        run: node tools/smoke-document-qa-acceptance.mjs
      - name: Verify document QA on a limited network
        if: ${{ !cancelled() && steps.document_browser.outcome == 'success' }}
        env:
          DOCUMENT_QA_REPORT: document-qa-acceptance-limited-report.json
        run: node tools/smoke-document-qa-acceptance.mjs --limited-network
      - name: Verify retry after a scan preflight failure
        if: ${{ !cancelled() && steps.document_browser.outcome == 'success' }}
        env:
          DOCUMENT_QA_REPORT: document-qa-acceptance-retry-report.json
        run: node tools/smoke-document-qa-acceptance.mjs --retry-scan
      - name: Record document verification provenance
        if: always()
        env:
          CHECK_OUTCOME: ${{ job.status }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const { GITHUB_SHA: commit, GITHUB_RUN_ID: run, GITHUB_RUN_ATTEMPT: attempt, GITHUB_EVENT_NAME: trigger, CHECK_OUTCOME: outcome } = process.env; const reports = fs.readdirSync(".").filter(name => /^document-qa-.*-report[.]json$/.test(name)).sort(); fs.writeFileSync("document-qa-run.json", JSON.stringify({commit, run, attempt, trigger, outcome, recordedAt:new Date().toISOString(), reports}, null, 2));'
      - name: Save document verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-qa-tables-report
          path: |
            document-qa-run.json
            document-qa-acceptance-report.json
            document-qa-synthetic-scan.pdf
            document-qa-acceptance-limited-report.json
            document-qa-acceptance-retry-report.json
            document-qa-pdf-report.json
            document-qa-long-pdf-report.json
            document-qa-long-pdf-report-comparison.md
            document-qa-dense-pdf-report.json
            document-qa-pdf-limits-report.json
            document-qa-tables-report.json
            document-qa-merged-report.json
            document-qa-merged-reversed-report.json
            document-qa-zero-report.json
            document-qa-wide-report.json
            document-qa-inventory-report.json
            document-qa-image-*-report.json
            document-qa-word-report.json
            document-qa-admission-years-report.json
          if-no-files-found: error
